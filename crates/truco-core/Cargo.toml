[package]
name = "truco-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Motor de reglas y capa de probabilidad del truco argentino (1v1)"

[lib]
# `cdylib` solo se usa para compilar a wasm; `rlib` sigue siendo lo que
# consumen los tests y el generador.
crate-type = ["cdylib", "rlib"]

[dependencies]

# Las formas del JSON que cruzan al navegador.
#
# Esto vive acá y NO gateado por target, por una razón concreta: los `struct`
# están en `web_types.rs`, un módulo normal, así que `cargo test` los mira y
# `cargo clippy --all-targets` los revisa. Antes estaban en `wasm.rs`, atrás de
# un cfg, y eso los dejaba sin ninguna cobertura.
#
# El costo es compilar `serde` en nativo. `serde` sin `derive` es una dependencia
# chica y el proyecto ya compila 76 millones de pares en los tests, así que es
# marginal al lado de eso.
serde = { version = "1", features = ["derive"] }
# Lo usan los tests de `web_types.rs` en nativo, y el motor en wasm.
serde_json = "1"

# Genera los tipos de TypeScript desde los mismos `struct`, para que
# `web/src/tipos.ts` no sea una copia que hay que mantener a mano. Es lo que
# evita que un campo nuevo exista en Rust y no en la pantalla.
ts-rs = "12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"